open_issues:
  - >
    Snapshot. 1953-01-31 is before Watson saw Photo 51 (30 January 1953) in some
    tellings and before the MRC report reached Crick (February 1953) and before
    Donohue's correction; but it is after Pauling's preprint was mailed (late
    January 1953). Decide whether the knowledge pack includes the Photo 51
    parameters and the C2 space group (both unpublished at T, but in the hands of
    the discoverers). Recommended - include them, flagged as "unpublished data
    available to the discoverers", since without them the target is
    underdetermined; and exclude Pauling-Corey (published February 1953).
  - Gulland, Jordan and Taylor (1947) hydrogen-bond titration evidence - citation from memory; journal and year should be checked.
  - Furberg dates (thesis 1949, cytidine structure 1950, Acta Chem Scand 1952) from memory.
  - Griffith's 1952 calculations and Chargaff's Cambridge visit (often dated late May or June 1952) need source checks.
  - Franklin's notebook entries (February 1953) as reported by Klug (1968, 1974) - the extent to which she had reached two chains and base interchangeability is debated; check Klug 1974 (Nature 248) and Cobb and Comfort (2023).
  - The claim that Bragg ordered a halt after the 1951 model is standard (Watson 1968; Olby 1974), but the precise form of the instruction varies between accounts.
  - Exact helical parameters - Watson and Crick gave 3.4 A rise and 10 residues per turn with a 34 A repeat; phosphorus at ~10 A radius. Modern B-DNA has ~10.5 bp per turn in solution; the oracle tolerance should accept either.
  - Cobb and Comfort (2023) end page not confirmed; start page 657 confirmed via secondary coverage.
