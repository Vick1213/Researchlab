open_issues:
  - >
    Snapshot choice. 1837-06-30 is just before Darwin opened Notebook B (July 1837),
    after Gould's identifications of the Beagle birds. Alternative: 1858-01-31 (just
    before Wallace's Ternate essay), which would include Vestiges, Wallace 1855 and
    Darwin's unpublished material is excluded either way. The later snapshot is
    richer but leaks more (Wallace 1855 is close to the target). Decide per experiment.
  - Two later objections are not in the pack but matter for evaluation. (1) Inheritance gap - Fleeming Jenkin's anonymous review (North British Review, June 1867) argued that a rare favourable variant would be swamped by crossing under blending inheritance; Darwin called it among the most troubling objections and shifted emphasis to many small individual differences. Revisionist work (Morris 1994, BJHS; a later arXiv paper) disputes how far Jenkin's text is really about blending. (2) Kelvin's thermal age of the Earth (1862; roughly 20-400 Myr, later narrowed to ~20-40 Myr) attacked Darwin's ~300 Myr estimate for the denudation of the Weald (Origin, 1st ed.), which Darwin removed in the 3rd edition (1861). Confirm the edition in which the Weald estimate was dropped.
  - The exact page and volume details for Wallace (1855) and Blyth (1835, 1837) have not been checked; volume numbers omitted deliberately.
  - Mayr's 1959 essay where "population thinking" vs "typological thinking" is introduced (in Meggers (ed.), Evolution and Anthropology - A Centennial Appraisal) is cited from memory; verify before adding as a source.
  - The claim that the island-dispersal pattern was recognised before 1837 is uncertain; it may need to move out of anomalies for an 1837 snapshot.
  - The "essentialism story" itself is contested by historians (Amundson 2005; Winsor 2006); the implicit assumption is phrased in Mayr's terms because that is the framing the project wants to test, but the historical fit is "likely", not "established".
