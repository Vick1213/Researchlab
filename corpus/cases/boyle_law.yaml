open_issues:
  - >
    Compression table values were taken from a transcription and confirmed only for
    rows 48, 46, 44, 24, 12 against a second transcription; check every row against a
    scan of the 1662 edition. Also confirm that one "space" is a quarter inch.
  - The rarefaction table numbers are not reproduced here; transcribe them from the 1662 text.
  - >
    Power's Experimental Philosophy carries the date 1664 on its title page but some
    sources say 1663; confirm. Confirm the Pendle Hill date (27 April 1661).
  - >
    Hooke's exact role: whether he built the J-tube, ran the 1662 trials, and what
    Micrographia (1665) reports on air compression. Sources disagree.
  - Confirm the 2 October 1661 Royal Society manuscript and its relation to the printed table.
  - >
    Confirm Mariotte's wording and whether his Discours (1676) was the second of his
    Essais de physique; confirm Regnault's high-pressure deviations date.
