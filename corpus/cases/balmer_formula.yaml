    kind: primary
  - citation: Ångström, A. J. (1868). Recherches sur le spectre solaire. Uppsala.
    kind: primary
  - citation: Rydberg, J. R. (1890). "On the structure of the line-spectra of the chemical elements." Philosophical Magazine, 5th series, 29.
    kind: primary
  - citation: Bohr, N. (1913). "On the constitution of atoms and molecules." Philosophical Magazine, 6th series, 26.
    kind: primary
  - citation: Hentschel, K. (2002). Mapping the Spectrum. Techniques of Visual Representation in Research and Teaching. Oxford University Press.
    kind: secondary
  - citation: Dictionary of Scientific Biography, entry "Balmer, Johann Jakob."
    kind: reference
open_issues:
  - >
    Page range of the Basel Verhandlungen paper differs between sources (548-560
    vs 548-556; DSB also lists a continuation at 750-752). Not given above.
  - >
    Confirm whether the comparison with Huggins' ultraviolet lines appears in the
    first Basel note, the continuation, or only the Annalen version, and whether
    Hagenbach supplied those values.
  - >
    Confirm Ångström's values are air wavelengths exactly as Balmer printed them
    (6562.10, 4860.74, 4340.1, 4101.2) rather than Ångström's 1868 original table,
    which some secondary sources give with slightly different rounding.
  - >
    Stoney's harmonic paper is variously dated 1868/1869 and 1871 (Phil. Mag. 41);
    confirm which paper contains the 20:27:32 ratio and whether it covers three or
    four lines.
  - Hartley (1883) and Schuster (1881) citations given without volume numbers; confirm.
  - >
    Hentschel (2002) is cited as a general history of spectroscopic representation;
    confirm it discusses Balmer specifically before relying on it.
