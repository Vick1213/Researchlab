open_issues:
  - >
    Fisher's aggregate figures (chi-square about 41.6, 84 df, P about 0.99993) are
    widely quoted but were not confirmed against the 1936 paper in this pass.
  - >
    Progeny-test counts 193:372 and 166:353 are from memory; confirm against the 1866
    text. Confirm the ten-progeny-per-plant detail for the seed versus plant characters
    (the seed characters could be scored from seeds of each plant, so the
    misclassification argument applies mainly to the plant characters).
  - >
    Darwin's Antirrhinum counts (88 : 2 : 37) were confirmed only from a secondary
    teaching page; check against Variation (1868), vol. 2.
  - >
    Naudin's publication dates (prize memoir 1861-1862, printed 1863 or 1865) and the
    Knight (1799) and Goss (1820s) pea work need checking.
  - >
    Olby (1979) argues Mendel was not a "Mendelian" - that he did not hold a theory of
    paired material factors in the modern sense. The hidden_target states the modern
    reading; the exact content of Mendel's own model (elements, cell formation) is
    debated and should be stated carefully in any knowledge pack.
  - Volume and page details for the 1900 rediscovery papers were not checked.
  - Confirm the 8 February and 8 March 1865 lecture dates and the 1866 issue date.
