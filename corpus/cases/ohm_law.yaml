open_issues:
  - >
    The eight-point data series and the constants a = 7285, b = 20 1/4 are given from
    memory of standard secondary reproductions; they are internally consistent (the
    hyperbola fits to about 1%) but were not confirmed against the 1826 paper in this
    pass. Check before using as oracle data, and confirm whether the series is from
    the 1826 Schweigger paper or reprinted in Poggendorff's Annalen.
  - Confirm that Poggendorff suggested the thermocouple, and the bismuth-copper pairing.
  - >
    Confirm Ohm's employment sequence: leave from Cologne in Berlin (1826-1827),
    resignation from Cologne (1827 or 1828), Berlin Kriegsschule, Nuremberg (1833).
    A Deutsches Museum record holds only a draft request for release.
  - >
    Barlow's 1825 result (often reported as current varying inversely with the
    square root of length) and Becquerel's measurements were not checked.
  - >
    Cavendish's exact conclusion and the 1781 date need checking against Maxwell's
    edition, The Electrical Researches of the Honourable Henry Cavendish (1879).
  - >
    Pouillet's priority dates (1831 vs 1837) and whether his work was independent of
    Ohm's; confirm Copley Medal year (1841) against the Royal Society list.
  - >
    Schagrin (1963) is cited from memory as a standard article on the reception;
    confirm volume and title.
