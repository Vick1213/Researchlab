open_issues:
  - >
    Snapshot date justification. 1912 would make the target "continental drift",
    for which the decisive evidence did not yet exist and Wegener's own mechanism
    was wrong; a solver would be judged against a target its pack cannot support.
    1960-06-30 is chosen because the key anomalies (global ridge and rift, thin
    sediment, ridge heat flow, Mason's 1958 stripes and fracture-zone offsets,
    divergent polar wander paths, Wadati-Benioff zones) were published, while
    Dietz (Nature, June 1961) and Hess (1962) were not. Hess's manuscript was
    circulated informally, dated 1959 by USGS and 1960 by other accounts (an ONR
    report); confirm against Frankel vol. 3. If it circulated in 1959, the pack is
    still defined by published literature, but note the leak risk. The reversal
    timescale (1963-1966) is held out for the oracle, so a solver must predict
    reversal stripes from the possibility of reversal, not from the timescale.
  - date_of_result is set to Vine and Matthews (Nature, 7 September 1963) as the first testable statement of the target; arguably it should be Hess (1962) or Morgan (1968). Confirm the 7 September issue date.
  - Volume numbers for Holmes (1931, vol. 18) and Wegener (1912, vol. 58) are from memory; page numbers omitted for most papers deliberately.
  - Heat-flow claim (ocean roughly equals continent; high at ridges) and its pre-1960 status need checking against Bullard, Maxwell and Revelle (1956) and Von Herzen (1959).
  - The "no ocean floor older than Cretaceous" claim for 1960 needs a source.
  - Nagata's Haruna dacite self-reversal date (1951-1952) from memory.
  - Carey's Hobart symposium (1956) was published in 1958; confirm.
  - Whether Holmes counts as a near miss for seafloor spreading is contested (Frankel discusses the differences); confidence likely.
