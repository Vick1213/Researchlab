open_issues:
  - >
    Le Verrier's 1859 excess (commonly given as 38 arcsec per century) and
    Newcomb's values (sources variously give 41.24 for 1882 and 43.37 for 1895)
    need checking against Roseveare (1982). The case uses "about 43" for the target.
  - >
    Eötvös precision. Commonly quoted as about 1 in 10^8 (1889-1909) and a few
    parts in 10^9 for the 1922 publication. The 1889 figure (sometimes given as
    1 in 2e7) was not confirmed.
  - >
    Sobral astrographic result. The value of about 0.93 arcsec is commonly
    quoted for the discounted plates but was not confirmed against Dyson,
    Eddington and Davidson (1920). The quoted uncertainties for the 4-inch and
    Principe results differ between secondary sources (e.g. +/-0.12 vs +/-0.30
    for Sobral).
  - >
    Pound-Rebka 1960 ratio to prediction (commonly quoted as 1.05 +/- 0.10) and
    tower height (22.5 m) are standard figures, not checked against the PRL. The
    1959 PRL proposed the method, and the 1960 PRL reported the result.
  - >
    Hilbert priority. Whether the cut portion of the proofs contained the field
    equations is unresolved. Corry-Renn-Stachel (1997) versus Winterberg (2004)
    and Sauer's later work. The exact dates of Hilbert's revisions were not checked.
