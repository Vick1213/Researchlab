open_issues:
  - >
    Historiographical debate on Michelson-Morley. Holton (1969) argues that the
    experiment played little or no direct role in Einstein's path, citing the 1905
    paper's mention of only "unsuccessful attempts to discover any motion of the
    earth relatively to the light medium" and Einstein's later statements. Einstein's
    own recollections (Shankland interviews 1950-1954, 1922 Kyoto lecture as
    reported by Ishiwara) are inconsistent about whether and when he knew of it.
    Most historians now hold that he knew of it, probably via Lorentz 1895, but that
    the magnet-conductor asymmetry, Fizeau and aberration, and the general failure
    of drift experiments weighed more. The knowledge pack should include
    Michelson-Morley, because it was available, without implying it was the
    trigger.
  - >
    Whether Einstein read Poincaré's 1898 essay or the 1904 St. Louis address
    before 1905 is uncertain. Solovine's recollection says the Olympia Academy read
    Poincaré's La Science et l'hypothèse (1902). The essay "La mesure du temps" was
    reprinted in La Valeur de la science (1905), after the snapshot. Galison argues
    for strong indirect influence via patent-office work on clock synchronization.
    This is suggestive but not documented.
  - Einstein had not read Lorentz 1904 before writing the 1905 paper, by most accounts. Confirm against Pais.
  - >
    Larmor's 1897/1900 transformations: confirm exact form and that time dilation
    is explicit (commonly stated; not checked against the text).
  - Michelson-Morley numbers (expected 0.4 fringe, observed under 0.01-0.02, arm length about 11 m) are standard textbook figures; confirm against the 1887 paper.
  - Dates for Rayleigh 1902, Brace 1904, Trouton-Noble 1903 null experiments were not checked against primary sources.
  - The reported Fizeau-drag derivation via relativistic velocity addition is attributed to Laue 1907; confirm.
  - Lorentz's 1886 critique of Stokes; confirm date and the exact form of the inconsistency argument.
  - The Seelig 1955 letter and the Besso conversation timing (about five weeks before submission) rest on Einstein's late recollections.
  - Alväger et al. 1964 citation details for the pion-decay photon speed test were not checked.
