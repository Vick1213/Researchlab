id: kepler_third_law
case: kepler_third_law          # corpus/cases/<case>.yaml
oracle:
  kind: law_fit                 # oracles/law_fit.py
  llm_free: true
  thresholds:
    max_params: 2
    train_max_rel_err: 0.02
    holdout_max_rel_err: 0.05
variants:
  historical:
    description: >
      Six planets as known in 1618, modern values rounded to about the precision
      available to Kepler. Held out: the four Galilean moons (a different central
      body, so the constant may change but the form must not). Contamination: total.
    pack: pack_historical.md
    train: data/planets.csv
    holdout: hidden/jovian_moons.csv
    observables:
      T: {role: target, dimension: time, column: period_days, unit: day}
      a: {role: input, dimension: length, column: mean_distance_au, unit: AU}
  synthetic:
    description: >
      Fictional system generated by make_synthetic.py with T proportional to r**1.25
      and 0.2% noise. Recalling Kepler's 3/2 fails the fit. Held out: a second
      system with a different constant. Measures fitting, not recall.
    pack: pack_synthetic.md
    train: data/synthetic_train.csv
    holdout: hidden/synthetic_holdout.csv
    observables:
      T: {role: target, dimension: time, column: cycle_time, unit: tick}
      r: {role: input, dimension: length, column: radius, unit: span}
